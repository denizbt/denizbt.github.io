<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} | {{ site.title }}</title>

  <!-- Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Lora and Open Sans -->
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
    rel="stylesheet">


  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon_io/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon_io/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon_io/favicon-16x16.png' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/favicon_io/site.webmanifest' | relative_url }}">
</head>

<body>
  <div class="page-wrapper">
    <aside class="sidebar">
      <div class="sidebar-top">
        <a href="/" class="sidebar-name">Deniz Bölöni-Turgut</a>
        <!-- <p class="sidebar-whimsy">⋆.˚⋆𓇼｡𖦹˙༄.°</p> -->
      </div>

      <!-- Mobile only: hamburger toggle -->
      <div class="sidebar-mobile-controls">
        <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle navigation" aria-expanded="false">
          <i class="fas fa-bars"></i>
        </button>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <a href="/" class="sidebar-link {% if page.nav_section == 'about' %}nav-active{% endif %}">About</a>
        <a href="/research/"
          class="sidebar-link {% if page.nav_section == 'research' %}nav-active{% endif %}">Research</a>
        <a href="/miscellany/"
          class="sidebar-link {% if page.nav_section == 'miscellany' %}nav-active{% endif %}">Miscellany</a>
        <a href="/assets/files/denizbt_CV.pdf" target="_blank" rel="noopener noreferrer" class="sidebar-link">CV</a>
      </nav>
    </aside>

    <main class="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <p>&copy; Copyright {{ site.time | date: "%Y" }} Deniz Bölöni-Turgut.</p>
      </div>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const externalLinks = document.querySelectorAll('.link--external, .link--research, .link--icon, .github-link');
      externalLinks.forEach(link => {
        link.setAttribute('target', '_blank');
        link.setAttribute('rel', 'noopener noreferrer');
      });

      const hamburger = document.getElementById('hamburger-btn');
      const nav = document.getElementById('sidebar-nav');
      const sidebar = document.querySelector('.sidebar');

      const updateSidebarShadow = () => {
        sidebar?.classList.toggle('is-scrolled', window.scrollY > 8);
      };
      updateSidebarShadow();
      window.addEventListener('scroll', updateSidebarShadow, { passive: true });

      if (hamburger && nav) {
        hamburger.addEventListener('click', function () {
          const isOpen = nav.classList.toggle('open');
          this.setAttribute('aria-expanded', isOpen);
          this.querySelector('i').className = isOpen ? 'fas fa-xmark' : 'fas fa-bars';
        });
      }
    });
  </script>
</body>

</html>
